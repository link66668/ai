<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 课程学习助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📚 学习助手</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item active">
                    <span class="icon">🏠</span> 仪表盘
                </a>
                <a href="/schedule.html" class="nav-item">
                    <span class="icon">📅</span> 课表
                </a>
                <a href="/courses.html" class="nav-item">
                    <span class="icon">📖</span> 知识库
                </a>
                <a href="/chat.html" class="nav-item">
                    <span class="icon">💬</span> Agent对话
                </a>
                <a href="/tasks.html" class="nav-item">
                    <span class="icon">✅</span> 任务管理
                </a>
                <a href="/ai_settings.html" class="nav-item">
                    <span class="icon">🤖</span> AI 配置
                </a>
                <a href="/profile.html" class="nav-item">
                    <span class="icon">👤</span> 个人中心
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline btn-block" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <div class="topbar">
                <h1>仪表盘</h1>
                <div class="topbar-actions">
                    <span class="user-info" id="userInfo">加载中...</span>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">📖</div>
                    <h4>活跃课程</h4>
                    <div class="stat-value" id="courseCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <h4>待办任务</h4>
                    <div class="stat-value" id="taskCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">💬</div>
                    <h4>对话记录</h4>
                    <div class="stat-value" id="chatCount">0</div>
                </div>
            </div>

            <!-- 今日课程 + 今日任务（双列） -->
            <div class="card mb-3">
                <div style="display:flex; gap:0;">
                    <div style="flex:1; border-right:1px solid var(--border);">
                        <div class="card-header" style="border-bottom:1px solid var(--border);">
                            <h3>📅 今日课程</h3>
                            <a href="/schedule.html" class="btn btn-sm btn-outline">查看全部</a>
                        </div>
                        <div class="card-body" id="todayCourses" style="min-height:120px;">
                            <div class="loading"><div class="spinner"></div></div>
                        </div>
                    </div>
                    <div style="flex:1;">
                        <div class="card-header" style="border-bottom:1px solid var(--border);">
                            <h3>✅ 今日任务</h3>
                            <a href="/tasks.html" class="btn btn-sm btn-outline">查看全部</a>
                        </div>
                        <div class="card-body" id="todayTasks" style="min-height:120px;">
                            <div class="loading"><div class="spinner"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷入口 -->
            <div class="card">
                <div class="card-header">
                    <h3>快捷操作</h3>
                </div>
                <div class="card-body">
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <a href="/courses.html" class="btn btn-primary">📖 新建课程</a>
                        <a href="/chat.html" class="btn btn-success">💬 开始对话</a>
                        <a href="/tasks.html" class="btn btn-outline">✅ 查看任务</a>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (!checkAuth()) throw new Error('未登录');

        // 显示用户信息
        const user = getCurrentUser();
        if (user) {
            document.getElementById('userInfo').textContent = `你好，${user.username}`;
        }

        // 加载仪表盘数据
        async function loadDashboard() {
            // 每个API独立加载，一个失败不影响其他
            async function safeCall(fn, onSuccess) {
                try {
                    const res = await fn();
                    onSuccess(res.data || []);
                } catch (e) {
                    console.warn('API调用失败:', e.message);
                    onSuccess([]);
                }
            }

            let courses = [], tasks = [], chats = [];

            await Promise.all([
                safeCall(() => api.getCourses(), data => { courses = data; }),
                safeCall(() => api.getTasks(), data => { tasks = data; }),
                safeCall(() => api.getConversations(), data => { chats = data; }),
            ]);

            // 更新统计
            document.getElementById('courseCount').textContent = courses.length;
            document.getElementById('taskCount').textContent = tasks.filter(t => t.status !== '已完成').length;
            document.getElementById('chatCount').textContent = chats.length;

            // 渲染今日任务（截止日期为今天的待办任务）
            renderTodayTasks(tasks);

            // 渲染今日课程（从课表描述中解析今日课程）
            renderTodayCourses(courses);
        }

        // ========== 课表解析（复用 schedule.html 的逻辑） ==========

        const DAY_NAMES = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        function parseSchedule(description) {
            if (!description) return [];
            const entries = [];
            const dayMap = {'星期一':0,'星期二':1,'星期三':2,'星期四':3,'星期五':4,'星期六':5,'星期日':6};
            const regex = /(星期[一二三四五六日])\s*\[(\d+(?:-\d+)*)\]节(?:\((\d{1,2}:\d{2}-\d{1,2}:\d{2})\))?\s*\|\s*(.+?)\s*\|\s*(.+)/g;
            let match;
            while ((match = regex.exec(description)) !== null) {
                const day = dayMap[match[1]];
                if (day === undefined) continue;
                const periodStr = match[2];
                const timeRange = match[3] || '';
                const location = match[4].trim();
                const weeks = match[5].trim();
                const periods = periodStr.split('-').map(Number).filter(n => !isNaN(n));
                entries.push({ day, periods, timeRange, location, weeks });
            }
            return entries;
        }

        function parseWeeks(weeksStr) {
            const weeks = new Set();
            const clean = weeksStr.replace(/\[周\]/g, '').trim();
            const parts = clean.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    if (!isNaN(start) && !isNaN(end)) {
                        for (let w = start; w <= end; w++) weeks.add(w);
                    }
                } else {
                    const n = Number(part);
                    if (!isNaN(n)) weeks.add(n);
                }
            });
            return [...weeks];
        }

        function calcCurrentWeek() {
            const startDateStr = localStorage.getItem('semester_start_date');
            if (!startDateStr) return null;
            const start = new Date(startDateStr + 'T00:00:00');
            const now = new Date();
            const diffMs = now - start;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const week = Math.floor(diffDays / 7) + 1;
            return Math.max(1, Math.min(20, week));
        }

        function getTodayCourses(courses) {
            const today = new Date().getDay();  // 0=星期日, 1=星期一, ...
            if (today === 0) return [];  // 星期日无课
            const currentWeek = calcCurrentWeek();

            const matched = [];
            for (const course of courses) {
                const entries = parseSchedule(course.description);
                if (!entries.length) continue;

                // 检查今天是否有课
                const todayEntries = entries.filter(e => e.day === today - 1);  // dayMap: 星期一=0
                if (!todayEntries.length) continue;

                // 如果知道当前周次，检查是否在本周有课
                if (currentWeek !== null) {
                    const inThisWeek = todayEntries.some(e => {
                        const weeks = parseWeeks(e.weeks);
                        return weeks.includes(currentWeek);
                    });
                    if (!inThisWeek) continue;
                }

                // 收集今天上课的时间段描述
                const timeSlots = todayEntries.map(e => {
                    const periodDesc = e.periods.length > 1
                        ? `${Math.min(...e.periods)}-${Math.max(...e.periods)}节`
                        : `${e.periods[0]}节`;
                    const time = e.timeRange ? ` (${e.timeRange})` : '';
                    const loc = e.location ? ` @${e.location}` : '';
                    return `${periodDesc}${time}${loc}`;
                });

                matched.push({ ...course, todaySlots: timeSlots });
            }

            return matched;
        }

        function renderTodayCourses(courses) {
            const container = document.getElementById('todayCourses');
            const todayCourses = getTodayCourses(courses);

            if (!todayCourses.length) {
                const todayName = DAY_NAMES[new Date().getDay()];
                const weekInfo = calcCurrentWeek() !== null
                    ? `（第 ${calcCurrentWeek()} 周）`
                    : '';
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size:32px; margin-bottom:8px;">🎉</p>
                        <p>${todayName}${weekInfo} 没有课程安排</p>
                    </div>`;
                return;
            }

            container.innerHTML = '<div class="today-course-list">' + todayCourses.map(course => `
                <div class="today-course-item" onclick="window.location.href='/course_detail.html?id=${course.id}'">
                    <div class="today-course-left">
                        <div class="today-course-name">${course.name}</div>
                        <div class="today-course-slots">
                            ${course.todaySlots.map(s => `<span class="today-slot">${s}</span>`).join('')}
                        </div>
                    </div>
                    <div class="today-course-right">
                        <span class="text-muted">👨‍🏫 ${course.teacher || '未设置'}</span>
                        <span class="text-muted">📎 ${course.doc_count || 0}</span>
                    </div>
                </div>
            `).join('') + '</div>';
        }

        function renderTodayTasks(tasks) {
            const container = document.getElementById('todayTasks');

            // 筛选今天的任务：截止日期是今天且未完成的
            const todayStr = new Date().toISOString().slice(0, 10);
            const todayTasks = tasks.filter(t =>
                t.status !== '已完成' &&
                t.due_date &&
                t.due_date.slice(0, 10) === todayStr
            ).slice(0, 5);

            if (!todayTasks.length) {
                container.innerHTML = '<div class="empty-state" style="padding:24px 0;"><p>今日暂无待办任务</p></div>';
                return;
            }

            container.innerHTML = '<ul class="task-list">' + todayTasks.map(task => `
                <li class="task-item">
                    <div class="task-checkbox" onclick="toggleTask(${task.id}, this)"></div>
                    <div class="task-info">
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            ${task.course_name ? `<span>${task.course_name}</span> · ` : ''}
                            <span class="task-priority ${getPriorityClass(task.priority)}">${task.priority}</span>
                            ${task.due_date ? ` · 截止: ${formatDate(task.due_date)}` : ''}
                        </div>
                    </div>
                </li>
            `).join('') + '</ul>';
        }

        function renderRecentTasks(tasks) {
            const container = document.getElementById('recentTasks');
            if (!tasks.length) {
                container.innerHTML = '<div class="empty-state"><p>暂无待办任务</p></div>';
                return;
            }

            container.innerHTML = '<ul class="task-list">' + tasks.map(task => `
                <li class="task-item ${task.status === '已完成' ? 'completed' : ''}">
                    <div class="task-checkbox" onclick="toggleTask(${task.id}, this)"></div>
                    <div class="task-info">
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            ${task.course_name ? `<span>${task.course_name}</span> · ` : ''}
                            <span class="task-priority ${getPriorityClass(task.priority)}">${task.priority}</span>
                            ${task.due_date ? ` · 截止: ${formatDate(task.due_date)}` : ''}
                        </div>
                    </div>
                </li>
            `).join('') + '</ul>';
        }

        async function toggleTask(taskId, el) {
            try {
                await api.completeTask(taskId);
                showToast('任务已完成', 'success');
                loadDashboard();
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
