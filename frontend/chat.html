<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent对话 - 课程学习助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 全局侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📚 学习助手</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item">
                    <span class="icon">🏠</span> 仪表盘
                </a>
                <a href="/courses.html" class="nav-item">
                    <span class="icon">📖</span> 课程管理
                </a>
                <a href="/chat.html" class="nav-item active">
                    <span class="icon">💬</span> Agent对话
                </a>
                <a href="/tasks.html" class="nav-item">
                    <span class="icon">✅</span> 任务管理
                </a>
                <a href="/ai_settings.html" class="nav-item">
                    <span class="icon">🤖</span> AI 配置
                </a>
                <a href="/profile.html" class="nav-item">
                    <span class="icon">👤</span> 个人中心
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline btn-block" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content" style="padding:0; display:flex; flex-direction:column;">

            <!-- 顶部栏 -->
            <div class="chat-topbar">
                <div class="chat-topbar-left">
                    <button class="chat-icon-btn" id="toggleSidebarBtn" onclick="toggleConvSidebar()" title="切换对话列表">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                    </button>
                    <span class="chat-topbar-title" id="topbarTitle">Agent 对话</span>
                </div>
                <div class="chat-topbar-right">
                    <select class="form-control course-select-mini" id="courseSelect" onchange="switchCourse()">
                        <option value="">通用对话</option>
                    </select>
                </div>
            </div>

            <!-- 聊天主体区 -->
            <div class="chat-body">

                <!-- 对话列表侧栏 -->
                <div class="conv-sidebar" id="convSidebar">
                    <div class="conv-sidebar-header">
                        <span>历史对话</span>
                        <button class="chat-icon-btn" onclick="newChat()" title="新建对话">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                    </div>
                    <div class="conv-list" id="convList">
                        <div class="conv-empty">暂无对话</div>
                    </div>
                </div>

                <!-- 聊天主区域 -->
                <div class="chat-main-area">

                    <!-- 欢迎屏 -->
                    <div class="chat-welcome" id="chatWelcome">
                        <div class="welcome-icon">💬</div>
                        <h2 class="welcome-title">课程学习助手</h2>
                        <p class="welcome-desc">选择课程并开始对话，AI 助手将为你提供专属答疑。你也可以上传文件（图片、PDF、Word）作为上下文。</p>
                        <div class="welcome-suggestions" id="welcomeSuggestions">
                            <button class="suggestion-card" onclick="handleSuggestion('帮我梳理这门课程的核心知识框架')">
                                <span class="suggestion-icon">💡</span>
                                <span class="suggestion-text">帮我梳理核心知识框架</span>
                            </button>
                            <button class="suggestion-card" onclick="handleSuggestion('这个知识点怎么理解和记忆？')">
                                <span class="suggestion-icon">🧠</span>
                                <span class="suggestion-text">知识点理解与记忆方法</span>
                            </button>
                            <button class="suggestion-card" onclick="handleSuggestion('帮我总结这门课程的重点内容')">
                                <span class="suggestion-icon">📝</span>
                                <span class="suggestion-text">总结课程重点内容</span>
                            </button>
                            <button class="suggestion-card" onclick="handleSuggestion('给我出几道练习题检验学习效果')">
                                <span class="suggestion-icon">🎯</span>
                                <span class="suggestion-text">出练习题检验效果</span>
                            </button>
                        </div>
                    </div>

                    <!-- 消息列表 -->
                    <div class="chat-messages-v2 hidden" id="chatMessages">
                        <!-- 动态插入消息 -->
                        <div class="chat-scroll-anchor" id="scrollAnchor"></div>
                    </div>

                    <!-- 临时文件栏 -->
                    <div class="temp-file-bar-v2 hidden" id="tempFileBar">
                        <span class="temp-file-label">📎 附件：</span>
                        <div class="temp-file-list" id="tempFileList"></div>
                        <button class="chat-icon-btn chat-icon-btn--sm" onclick="clearTempFiles()" title="清除所有附件">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>

                    <!-- 输入区 (Composer) -->
                    <div class="chat-composer" id="chatComposer"
                         ondrop="handleComposerDrop(event)"
                         ondragover="event.preventDefault(); event.dataTransfer.dropEffect='copy';">
                        <!-- 附件预览行 -->
                        <div class="composer-attachments hidden" id="composerAttachments"></div>
                        <div class="composer-row">
                            <!-- 工具按钮 -->
                            <div class="composer-tools">
                                <label class="chat-icon-btn" for="tempFileInput" title="上传附件（图片/PDF/Word等）">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                </label>
                                <input type="file" id="tempFileInput" style="display:none"
                                    accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.gif"
                                    onchange="handleTempFileUpload(this)" multiple>
                                <!-- 知识库选择按钮 -->
                                <div class="kb-selector-wrapper">
                                    <button class="kb-selector-btn" id="kbSelectorBtn" onclick="toggleKbMenu(event)" title="选择引用知识库">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                                        <span class="kb-selector-label" id="kbLabel">不引用</span>
                                    </button>
                                    <div class="kb-dropdown hidden" id="kbDropdown">
                                        <div class="kb-dropdown-item active" data-kb-id="" onclick="selectKb('', '不引用')">
                                            <span class="kb-item-icon">🚫</span> 不引用知识库
                                        </div>
                                        <div class="kb-dropdown-divider"></div>
                                        <div id="kbDropdownList"><!-- 动态填充课程列表 --></div>
                                    </div>
                                </div>
                            </div>
                            <!-- 文本输入 -->
                            <textarea class="composer-textarea" id="chatInput"
                                placeholder="输入你的问题... (Shift+Enter 换行)"
                                rows="1"
                                onkeydown="handleInputKey(event)"
                                oninput="autoResizeTextarea(this)"
                                onpaste="handleComposerPaste(event)"></textarea>
                            <!-- 发送 / 停止 -->
                            <button class="composer-send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                            <button class="composer-stop-btn hidden" id="stopBtn" onclick="stopStreaming()" title="停止生成">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
    /* ================================================================
     *  chat.html — 对话页面
     * ================================================================ */

    if (!checkAuth()) throw new Error('未登录');

    // ========== 全局状态 ==========
    const ChatState = {
        conversations: [],
        activeConversationId: null,
        isStreaming: false,         // boolean
        currentCourseId: getUrlParam('course_id') || '',
        courses: [],
    };

    // ========== 流式状态 ==========
    let currentStreamController = null;
    let tempFileSessionId = null;
    let tempFiles = [];             // [{file_id, filename, file_type, file_size, status, preview}]

    // ========== 知识库选择状态 ==========
    let selectedKbCourseId;    // undefined=未选(纯AI对话) / ''=不引用 / <id>=指定课程知识库

    // 流式渲染优化 (rAF 批处理 + 稳定内容缓存)
    let streamRafId = null;
    let pendingStreamText = null;
    let lastStableHtml = '';
    let lastStableBoundary = -1;

    // ========== 对话侧栏切换 ==========
    function toggleConvSidebar() {
        const sidebar = document.getElementById('convSidebar');
        sidebar.classList.toggle('collapsed');
    }

    // ========== 课程加载与切换 ==========
    async function loadCourses() {
        try {
            const result = await api.getCourses();
            ChatState.courses = result.data || [];
            const select = document.getElementById('courseSelect');
            select.innerHTML = '<option value="">通用对话</option>' +
                ChatState.courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if (ChatState.currentCourseId) select.value = ChatState.currentCourseId;
        } catch (e) {
            console.error('加载课程失败', e);
        }
    }

    function switchCourse() {
        clearTempFiles(true);
        ChatState.currentCourseId = document.getElementById('courseSelect').value;
        ChatState.activeConversationId = null;
        loadConversations();
        showWelcomeScreen();
    }

    // ========== 对话列表 ==========
    async function loadConversations() {
        try {
            const result = await api.getConversations(ChatState.currentCourseId || undefined);
            ChatState.conversations = result.data || [];
            renderConvList();

            // 仅在没有活跃对话且未在流式传输时自动选中
            if (ChatState.conversations.length && !ChatState.activeConversationId && !ChatState.isStreaming) {
                selectConversation(ChatState.conversations[0].id);
            }
        } catch (e) {
            showToast('加载对话列表失败', 'error');
        }
    }

    function renderConvList() {
        const container = document.getElementById('convList');
        if (!ChatState.conversations.length) {
            container.innerHTML = '<div class="conv-empty">暂无对话</div>';
            return;
        }
        container.innerHTML = ChatState.conversations.map(conv => {
            const isActive = conv.id == ChatState.activeConversationId;
            return `
                <div class="conv-item ${isActive ? 'active' : ''}"
                     onclick="selectConversation(${conv.id})" data-conv-id="${conv.id}">
                    <span class="conv-item-icon">💬</span>
                    <span class="conv-item-title">${escapeHtml(conv.title || '新对话')}</span>
                    <button class="conv-item-delete" onclick="event.stopPropagation(); deleteConversation(${conv.id})" title="删除">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>`;
        }).join('');
    }

    function getActiveConversation() {
        return ChatState.conversations.find(c => c.id == ChatState.activeConversationId);
    }

    async function selectConversation(convId) {
        // 流式传输中不允许切换，防止 stream 回调写入错误的 DOM
        if (ChatState.isStreaming) return;
        // 切换对话时清空上一个对话的临时文件上下文
        clearTempFiles(true);
        ChatState.activeConversationId = convId;
        renderConvList();
        updateTopbarTitle();
        await loadMessages();
    }

    async function newChat() {
        clearTempFiles(true);
        try {
            const result = await api.createConversation(ChatState.currentCourseId || null, '新对话');
            ChatState.activeConversationId = result.data.id;
            await loadConversations();
            showWelcomeScreen();
            document.getElementById('chatInput').focus();
        } catch (e) {
            showToast('创建对话失败', 'error');
        }
    }

    async function deleteConversation(convId) {
        if (!confirm('确定删除这个对话吗？')) return;
        try {
            await api.deleteConversation(convId);
            ChatState.conversations = ChatState.conversations.filter(c => c.id != convId);
            if (ChatState.activeConversationId == convId) {
                clearTempFiles(true);
                ChatState.activeConversationId = null;
                showWelcomeScreen();
            }
            renderConvList();
            updateTopbarTitle();
            showToast('对话已删除', 'info');
        } catch (e) {
            showToast('删除失败', 'error');
        }
    }

    function updateTopbarTitle() {
        const conv = getActiveConversation();
        document.getElementById('topbarTitle').textContent = conv ? (conv.title || '新对话') : 'Agent 对话';
    }

    // ========== 欢迎屏 / 消息列表切换 ==========
    function showWelcomeScreen() {
        document.getElementById('chatWelcome').classList.remove('hidden');
        document.getElementById('chatMessages').classList.add('hidden');
    }

    function showMessagesArea() {
        document.getElementById('chatWelcome').classList.add('hidden');
        document.getElementById('chatMessages').classList.remove('hidden');
    }

    // ========== 消息加载与渲染 ==========
    async function loadMessages() {
        if (!ChatState.activeConversationId) return;
        // 记录发起请求时的对话 ID，防止竞态：
        // newChat() → loadConversations() → selectConversation(old) → loadMessages()
        // 如果在 await 期间用户切到了新对话，这次加载应丢弃
        const requestedConvId = ChatState.activeConversationId;
        try {
            const result = await api.getMessages(requestedConvId);
            // await 返回后检查：对话是否已被切换？
            if (ChatState.activeConversationId != requestedConvId) return;
            const messages = result.data || [];
            renderMessages(messages);
        } catch (e) {
            if (ChatState.activeConversationId != requestedConvId) return;
            showToast('加载消息失败', 'error');
        }
    }

    function renderMessages(messages) {
        const container = document.getElementById('chatMessages');

        if (!messages.length) {
            showWelcomeScreen();
            return;
        }

        showMessagesArea();

        // 清空（保留 scroll anchor）
        const anchor = document.getElementById('scrollAnchor');
        container.innerHTML = '';

        messages.forEach(msg => {
            container.appendChild(createMessageElement(msg));
        });

        container.appendChild(anchor);
        scrollToBottom();
    }

    /**
     * 创建单条消息 DOM
     */
    function createMessageElement(msg) {
        const isUser = msg.role === 'user';
        const div = document.createElement('div');
        div.className = `msg-v2 ${isUser ? 'msg-user' : 'msg-assistant'}`;

        // 头像
        const avatar = document.createElement('div');
        avatar.className = `msg-avatar ${isUser ? 'msg-avatar-user' : 'msg-avatar-ai'}`;
        avatar.textContent = isUser ? '👤' : '🤖';

        // 内容容器
        const content = document.createElement('div');
        content.className = 'msg-body';

        // 附件展示
        if (msg.references && msg.references.length > 0 && !isUser) {
            const refsDiv = document.createElement('div');
            refsDiv.className = 'msg-refs';
            const courseRefs = msg.references.filter(r => r.source !== 'temp_file');
            const tempRefs = msg.references.filter(r => r.source === 'temp_file');
            let refHtml = '';
            if (courseRefs.length) {
                refHtml += '📚 ' + courseRefs.map(r => {
                    const name = r.doc_name || `文档${r.document_id || ''}`;
                    return `<span title="${escapeHtml(name)}" style="cursor:help;">[${r.num || '?'}] ${escapeHtml(name)}</span>`;
                }).join('、');
            }
            if (tempRefs.length) refHtml += ' <span class="temp-file-badge">临时文件</span>';
            refsDiv.innerHTML = refHtml;
            content.appendChild(refsDiv);
        }

        // 气泡
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${isUser ? 'msg-bubble-user' : 'msg-bubble-ai'}`;
        if (isUser) {
            const p = document.createElement('p');
            p.style.whiteSpace = 'pre-wrap';
            p.textContent = msg.content;
            bubble.appendChild(p);
        } else {
            bubble.innerHTML = renderMarkdown(msg.content || '');
        }
        content.appendChild(bubble);

        // 时间戳
        const time = document.createElement('span');
        time.className = 'msg-time';
        time.textContent = formatMessageTime(msg.created_at);
        content.appendChild(time);

        div.appendChild(avatar);
        div.appendChild(content);
        return div;
    }

    function formatMessageTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        const anchor = document.getElementById('scrollAnchor');
        if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });
    }

    // ========== 发送消息 ==========
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const content = input.value.trim();
        if (!content && tempFiles.length === 0) return;
        if (ChatState.isStreaming) return;

        // 确保有活跃对话
        if (!ChatState.activeConversationId) {
            try {
                const title = content ? content.slice(0, 50) : '新对话';
                const result = await api.createConversation(ChatState.currentCourseId || null, title);
                ChatState.activeConversationId = result.data.id;
                await loadConversations();
            } catch (e) {
                showToast('创建对话失败', 'error');
                return;
            }
        }

        // 清空输入
        input.value = '';
        input.style.height = 'auto';

        // 清空消息区旧消息：仅从欢迎页首次发送时清空
        const container = document.getElementById('chatMessages');
        const fromWelcome = !document.getElementById('chatWelcome').classList.contains('hidden');
        if (fromWelcome) {
            container.innerHTML = '<div class="chat-scroll-anchor" id="scrollAnchor"></div>';
        }
        showMessagesArea();

        // 快照当前对话 ID — 流式回调中使用此值，防止竞态
        const streamConvId = ChatState.activeConversationId;

        // 插入用户消息气泡
        const userMsgEl = createMessageElement({
            role: 'user',
            content: content,
            references: [],
            created_at: new Date().toISOString()
        });

        // 插入 AI 占位气泡 (带加载动画)
        const aiMsgId = 'msg-streaming-' + Date.now();
        const aiMsgEl = document.createElement('div');
        aiMsgEl.className = 'msg-v2 msg-assistant';
        aiMsgEl.id = aiMsgId;
        aiMsgEl.innerHTML = `
            <div class="msg-avatar msg-avatar-ai">🤖</div>
            <div class="msg-body">
                <div class="msg-bubble msg-bubble-ai">
                    <div class="streaming-dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="msg-refs hidden" id="${aiMsgId}-refs"></div>
                <span class="msg-time">${formatMessageTime(new Date().toISOString())}</span>
            </div>`;

        // 在 scroll anchor 前插入
        const anchor = document.getElementById('scrollAnchor');
        container.insertBefore(userMsgEl, anchor);
        container.insertBefore(aiMsgEl, anchor);
        scrollToBottom();

        // 切换按钮状态
        setStreamingUI(true);

        const bubble = aiMsgEl.querySelector('.msg-bubble');
        const refsEl = document.getElementById(`${aiMsgId}-refs`);

        // 调用 SSE 流式 API
        currentStreamController = api.streamMessage(
            streamConvId, content, tempFileSessionId, selectedKbCourseId,

            // onChunk — rAF 批处理渲染
            (delta, fullText) => {
                scheduleStreamUpdate(bubble, fullText, container);
            },

            // onDone — 最终渲染
            (fullText, citations, interrupted) => {
                if (streamRafId) { cancelAnimationFrame(streamRafId); streamRafId = null; }
                const finalText = fullText || pendingStreamText || '';
                pendingStreamText = null;
                lastStableHtml = '';
                lastStableBoundary = -1;

                // 替换 streaming dots 为最终 markdown
                bubble.innerHTML = renderMarkdown(finalText);

                // 显示引用来源 — 知识库文件来源卡片
                if (citations && citations.length) {
                    const courseRefs = citations.filter(c => c.source !== 'temp_file');
                    const tempRefs = citations.filter(c => c.source === 'temp_file');
                    let refHtml = '';

                    if (courseRefs.length) {
                        refHtml += '<div class="msg-refs-header">'
                            + '<span class="kb-icon">📖</span> 知识库来源'
                            + '</div>'
                            + '<div class="msg-refs-list">'
                            + courseRefs.map(r => {
                                const name = r.doc_name || `文档${r.document_id || ''}`;
                                const heading = r.heading_path
                                    ? ` <span class="ref-heading">› ${escapeHtml(r.heading_path)}</span>`
                                    : '';
                                return `<span class="msg-refs-item">`
                                    + `<span class="ref-num">${r.num}</span>`
                                    + `<span class="ref-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>`
                                    + heading
                                    + `</span>`;
                            }).join('') + '</div>';
                    }

                    if (tempRefs.length) {
                        refHtml += '<span class="temp-file-badge" style="margin:4px 8px;">📎 临时文件</span>';
                    }

                    refsEl.innerHTML = refHtml;
                    refsEl.classList.remove('hidden');
                }

                if (interrupted) showToast('生成已停止', 'warning');

                setStreamingUI(false);
                currentStreamController = null;
            },

            // onError
            (error) => {
                if (streamRafId) { cancelAnimationFrame(streamRafId); streamRafId = null; }
                pendingStreamText = null;
                lastStableHtml = '';
                lastStableBoundary = -1;

                bubble.innerHTML = '<em style="color:var(--gray-500)">AI 服务暂时不可用: ' + escapeHtml(error.message) + '</em>';
                setStreamingUI(false);
                currentStreamController = null;
                showToast('发送失败: ' + error.message, 'error');
            }
        );
    }

    function stopStreaming() {
        if (currentStreamController) {
            currentStreamController.abort();
            if (ChatState.activeConversationId) {
                api.interruptStream(ChatState.activeConversationId).catch(() => {});
            }
            currentStreamController = null;
        }
    }

    function setStreamingUI(streaming) {
        ChatState.isStreaming = streaming;
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        if (streaming) {
            sendBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
        } else {
            sendBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
        }
    }

    // ========== 流式渲染优化 (rAF + 段落缓存) ==========
    function scheduleStreamUpdate(bubble, fullText, container) {
        pendingStreamText = fullText;
        if (!streamRafId) {
            streamRafId = requestAnimationFrame(() => {
                streamRafId = null;
                if (pendingStreamText !== null) {
                    performStreamUpdate(bubble, pendingStreamText, container);
                    pendingStreamText = null;
                }
            });
        }
    }

    function performStreamUpdate(bubble, text, container) {
        // 按段落边界(\n\n)分割，缓存已完成段落的 HTML
        const boundary = text.lastIndexOf('\n\n');
        let newHtml;
        if (boundary > 0 && boundary !== lastStableBoundary) {
            const stableRaw = text.slice(0, boundary);
            const tailRaw = text.slice(boundary);
            lastStableHtml = renderMarkdown(stableRaw);
            lastStableBoundary = boundary;
            newHtml = lastStableHtml + renderMarkdown(tailRaw);
        } else if (boundary > 0 && boundary === lastStableBoundary) {
            const tailRaw = text.slice(boundary);
            newHtml = lastStableHtml + renderMarkdown(tailRaw);
        } else {
            newHtml = renderMarkdown(text);
        }
        // 追加流式光标
        bubble.innerHTML = newHtml + '<span class="streaming-cursor-v2"></span>';
        scrollToBottom();
    }

    // ========== 知识库选择器 ==========
    function populateKbDropdown() {
        const listEl = document.getElementById('kbDropdownList');
        if (!ChatState.courses || !ChatState.courses.length) {
            listEl.innerHTML = '<div class="kb-dropdown-empty">暂无课程</div>';
            return;
        }
        listEl.innerHTML = ChatState.courses.map(c => `
            <div class="kb-dropdown-item ${selectedKbCourseId == c.id ? 'active' : ''}"
                 data-kb-id="${c.id}"
                 onclick="selectKb('${c.id}', '${escapeHtml(c.name)}')">
                <span class="kb-item-icon">📖</span> ${escapeHtml(c.name)}
            </div>
        `).join('');
    }

    function toggleKbMenu(event) {
        event.stopPropagation();
        const dropdown = document.getElementById('kbDropdown');
        if (dropdown.classList.contains('hidden')) {
            populateKbDropdown();
            dropdown.classList.remove('hidden');
        } else {
            dropdown.classList.add('hidden');
        }
    }

    function selectKb(courseId, courseName) {
        selectedKbCourseId = courseId;
        const label = document.getElementById('kbLabel');
        const btn = document.getElementById('kbSelectorBtn');

        if (courseId) {
            label.textContent = courseName;
            btn.classList.add('kb-active');
        } else {
            label.textContent = '不引用';
            btn.classList.remove('kb-active');
        }

        // 更新 dropdown 中的 active 状态
        document.querySelectorAll('.kb-dropdown-item').forEach(el => {
            el.classList.toggle('active', el.dataset.kbId == courseId);
        });

        document.getElementById('kbDropdown').classList.add('hidden');
    }

    // 点击外部关闭知识库下拉菜单
    document.addEventListener('click', (e) => {
        const wrapper = document.querySelector('.kb-selector-wrapper');
        if (wrapper && !wrapper.contains(e.target)) {
            document.getElementById('kbDropdown').classList.add('hidden');
        }
    });

    // ========== Composer: 自动调整高度 ==========
    function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function handleInputKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ========== Composer: 拖拽文件 ==========
    function handleComposerDrop(e) {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
            // 复用文件上传逻辑
            const fileInput = document.getElementById('tempFileInput');
            // 由于 input[type=file] 不能通过 JS 设置 files, 我们直接处理
            handleDroppedFiles(e.dataTransfer.files);
        }
    }

    async function handleDroppedFiles(fileList) {
        for (const file of Array.from(fileList)) {
            await uploadSingleTempFile(file);
        }
    }

    // ========== Composer: 粘贴图片 ==========
    function handleComposerPaste(e) {
        const items = e.clipboardData.items;
        const imageFiles = [];
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                const file = item.getAsFile();
                if (file) imageFiles.push(file);
            }
        }
        if (imageFiles.length > 0) {
            e.preventDefault();
            handleDroppedFiles(imageFiles);
        }
    }

    // ========== 建议卡片点击 ==========
    async function handleSuggestion(text) {
        if (!ChatState.activeConversationId) {
            try {
                const result = await api.createConversation(ChatState.currentCourseId || null, text.slice(0, 50));
                ChatState.activeConversationId = result.data.id;
                loadConversations();
            } catch (e) {
                showToast('创建对话失败', 'error');
                return;
            }
        }
        document.getElementById('chatInput').value = text;
        sendMessage();
    }

    // ========== 临时文件处理 ==========
    const MAX_TEMP_FILE_SIZE = 200 * 1024 * 1024;

    async function handleTempFileUpload(input) {
        if (!input.files || !input.files[0]) return;
        const files = Array.from(input.files);
        input.value = '';
        for (const file of files) {
            await uploadSingleTempFile(file);
        }
    }

    async function uploadSingleTempFile(file) {
        if (file.size > MAX_TEMP_FILE_SIZE) {
            showToast(`文件过大 (${formatFileSize(file.size)})，最大支持 200MB`, 'error');
            return;
        }

        // 自动创建对话
        if (!ChatState.activeConversationId) {
            try {
                const result = await api.createConversation(ChatState.currentCourseId || null, '附件对话');
                ChatState.activeConversationId = result.data.id;
                await loadConversations();
            } catch (e) {
                showToast('创建对话失败', 'error');
                return;
            }
        }

        // 先显示"处理中"占位
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        const tempStatusId = 'uploading-' + Date.now();
        tempFiles.push({
            file_id: tempStatusId,
            filename: file.name,
            file_type: ext,
            file_size: file.size,
            status: 'processing'
        });
        renderTempFileBar();

        try {
            const result = await api.uploadTempFile(ChatState.activeConversationId, file);
            const fileData = result.data.file;
            tempFileSessionId = result.data.session_id;

            const idx = tempFiles.findIndex(f => f.file_id === tempStatusId);
            if (idx >= 0) {
                tempFiles[idx].file_id = fileData.file_id;
                tempFiles[idx].filename = fileData.filename;
                tempFiles[idx].file_type = fileData.file_type;
                tempFiles[idx].file_size = fileData.file_size;
            }
            renderTempFileBar();

            // 启动轮询
            pollTempFileStatus(fileData.file_id);
            showToast(`文件已接收，正在处理: ${fileData.filename}`, 'success');
        } catch (e) {
            const idx = tempFiles.findIndex(f => f.file_id === tempStatusId);
            if (idx >= 0) tempFiles[idx].status = 'error';
            renderTempFileBar();
            showToast('文件上传失败: ' + e.message, 'error');
        }
    }

    async function pollTempFileStatus(fileId) {
        const maxPolls = 120;
        let pollCount = 0;
        while (pollCount < maxPolls) {
            await new Promise(resolve => setTimeout(resolve, 5000));
            try {
                const result = await api.getTempFileStatus(ChatState.activeConversationId, fileId);
                const status = result.data.status;
                if (status === 'done') {
                    const idx = tempFiles.findIndex(f => f.file_id === fileId);
                    if (idx >= 0) { tempFiles[idx].status = 'done'; tempFiles[idx].preview = result.data.preview || ''; }
                    renderTempFileBar();
                    return;
                } else if (status === 'error') {
                    const idx = tempFiles.findIndex(f => f.file_id === fileId);
                    if (idx >= 0) tempFiles[idx].status = 'error';
                    renderTempFileBar();
                    return;
                }
            } catch (e) { /* retry */ }
            pollCount++;
        }
        const idx = tempFiles.findIndex(f => f.file_id === fileId);
        if (idx >= 0 && tempFiles[idx].status === 'processing') {
            tempFiles[idx].status = 'done';
            renderTempFileBar();
        }
    }

    function renderTempFileBar() {
        const bar = document.getElementById('tempFileBar');
        const list = document.getElementById('tempFileList');

        if (tempFiles.length === 0) {
            bar.classList.add('hidden');
            return;
        }

        bar.classList.remove('hidden');
        list.innerHTML = tempFiles.map(f => {
            let statusBadge = '';
            if (f.status === 'processing') {
                statusBadge = '<span class="temp-file-status processing">⏳</span>';
            } else if (f.status === 'error') {
                statusBadge = '<span class="temp-file-status error">❌</span>';
            }
            return `
                <span class="temp-file-item-v2">
                    ${getFileEmoji(f.file_type)} <span class="temp-file-name">${escapeHtml(f.filename)}</span>
                    ${statusBadge}
                    <span class="temp-file-remove" onclick="removeTempFile('${f.file_id}')">&times;</span>
                </span>`;
        }).join('');
    }

    function removeTempFile(fileId) {
        tempFiles = tempFiles.filter(f => f.file_id !== fileId);
        if (tempFiles.length === 0) tempFileSessionId = null;
        renderTempFileBar();
    }

    function clearTempFiles(silent = false) {
        tempFiles = [];
        tempFileSessionId = null;
        renderTempFileBar();
        if (!silent) showToast('附件已清除', 'info');
    }

    // ========== 页面可见性 & 卸载处理 ==========
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && currentStreamController) {
            scrollToBottom();
        }
    });

    window.addEventListener('beforeunload', () => {
        if (currentStreamController) {
            currentStreamController.abort();
            if (ChatState.activeConversationId) {
                navigator.sendBeacon(
                    `${API_BASE}/conversations/${ChatState.activeConversationId}/interrupt`,
                    new Blob([JSON.stringify({})], { type: 'application/json' })
                );
            }
            currentStreamController = null;
        }
    });

    // ========== 初始化 ==========
    loadCourses().then(() => loadConversations());
    </script>
</body>
</html>
