<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent对话 - 课程学习助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📚 学习助手</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item">
                    <span class="icon">🏠</span> 仪表盘
                </a>
                <a href="/courses.html" class="nav-item">
                    <span class="icon">📖</span> 课程管理
                </a>
                <a href="/chat.html" class="nav-item active">
                    <span class="icon">💬</span> Agent对话
                </a>
                <a href="/tasks.html" class="nav-item">
                    <span class="icon">✅</span> 任务管理
                </a>
                <a href="/plan.html" class="nav-item">
                    <span class="icon">📅</span> 学习计划
                </a>
                <a href="/ai_settings.html" class="nav-item">
                    <span class="icon">🤖</span> AI 配置
                </a>
                <a href="/profile.html" class="nav-item">
                    <span class="icon">👤</span> 个人中心
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline btn-block" onclick="logout()">退出登录</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <div class="topbar">
                <h1>Agent 对话</h1>
                <div class="topbar-actions">
                    <select class="form-control" style="width:180px;" id="courseSelect" onchange="switchCourse()">
                        <option value="">通用对话</option>
                    </select>
                    <button class="btn btn-primary" onclick="newChat()">+ 新建对话</button>
                </div>
            </div>

            <div class="chat-container">
                <!-- 对话列表 -->
                <div class="chat-sidebar">
                    <div class="chat-sidebar-header">
                        <strong>历史对话</strong>
                    </div>
                    <div class="chat-list" id="chatList">
                        <div class="empty-state" style="padding:30px;">
                            <p>暂无对话</p>
                        </div>
                    </div>
                </div>

                <!-- 聊天区域 -->
                <div class="chat-main">
                    <!-- 临时文件栏 -->
                    <div class="temp-file-bar hidden" id="tempFileBar">
                        <span class="temp-file-label">📎 临时文件：</span>
                        <div class="temp-file-list" id="tempFileList"></div>
                        <button class="btn btn-sm btn-outline" onclick="clearTempFiles()" title="清除所有临时文件">清除</button>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-state">
                            <div class="icon">💬</div>
                            <h3>开始你的学习之旅</h3>
                            <p>选择课程并创建新对话，AI助手将为你提供专属答疑</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <label class="btn btn-outline btn-icon" for="tempFileInput" title="上传临时文件（图片/PDF/Word等）">📎</label>
                        <input type="file" id="tempFileInput" style="display:none"
                            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.gif"
                            onchange="handleTempFileUpload(this)">
                        <textarea class="chat-input" id="chatInput" placeholder="输入你的问题..." rows="1"
                            onkeydown="handleInputKey(event)"></textarea>
                        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
                        <button class="btn btn-danger btn-icon hidden" id="stopBtn" onclick="stopStreaming()" title="停止生成">⏹</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (!checkAuth()) throw new Error('未登录');

        let currentCourseId = getUrlParam('course_id') || '';
        let currentConvId = null;
        let conversations = [];
        let courses = [];

        // 流式和临时文件状态
        let currentStreamController = null;
        let tempFileSessionId = null;
        let tempFiles = [];  // [{file_id, filename, file_type, file_size, preview}]

        // 流式渲染优化
        let streamRafId = null;
        let pendingStreamText = null;

        // 加载课程列表
        async function loadCourses() {
            try {
                const result = await api.getCourses();
                courses = result.data || [];
                const select = document.getElementById('courseSelect');
                select.innerHTML = '<option value="">通用对话</option>' +
                    courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

                if (currentCourseId) {
                    select.value = currentCourseId;
                }
            } catch (error) {
                console.error(error);
            }
        }

        // 加载对话列表
        async function loadConversations() {
            try {
                const result = await api.getConversations(currentCourseId || undefined);
                conversations = result.data || [];
                renderChatList();

                // 如果有对话且没有当前对话，选中第一个
                if (conversations.length && !currentConvId) {
                    selectConversation(conversations[0].id);
                }
            } catch (error) {
                showToast('加载对话列表失败', 'error');
            }
        }

        function renderChatList() {
            const container = document.getElementById('chatList');
            if (!conversations.length) {
                container.innerHTML = '<div class="empty-state" style="padding:30px;"><p>暂无对话</p></div>';
                return;
            }

            container.innerHTML = conversations.map(conv => `
                <div class="chat-item ${conv.id === currentConvId ? 'active' : ''}"
                     onclick="selectConversation(${conv.id})">
                    <div class="chat-item-title">${conv.title || '新对话'}</div>
                    <div class="chat-item-time">${formatDateTime(conv.updated_at)}</div>
                </div>
            `).join('');
        }

        function switchCourse() {
            currentCourseId = document.getElementById('courseSelect').value;
            currentConvId = null;
            loadConversations();
            document.getElementById('chatMessages').innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <h3>开始你的学习之旅</h3>
                    <p>选择课程并创建新对话，AI助手将为你提供专属答疑</p>
                </div>
            `;
        }

        async function newChat() {
            try {
                const result = await api.createConversation(currentCourseId || null, '新对话');
                currentConvId = result.data.id;
                await loadConversations();

                document.getElementById('chatMessages').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🤖</div>
                        <h3>新对话已创建</h3>
                        <p>在下方输入框开始提问吧！</p>
                    </div>
                `;
                document.getElementById('chatInput').focus();
            } catch (error) {
                showToast('创建对话失败', 'error');
            }
        }

        async function selectConversation(convId) {
            currentConvId = convId;
            renderChatList();
            await loadMessages();
        }

        async function loadMessages() {
            if (!currentConvId) return;

            try {
                const result = await api.getMessages(currentConvId);
                const messages = result.data || [];
                renderMessages(messages);
            } catch (error) {
                showToast('加载消息失败', 'error');
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!messages.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🤖</div>
                        <h3>开始对话</h3>
                        <p>在下方输入框输入你的问题</p>
                    </div>`;
                return;
            }
            const html = messages.map(msg => `
                <div class="message ${msg.role}">
                    <div class="message-avatar">${msg.role === 'user' ? '我' : 'AI'}</div>
                    <div class="message-content">
                        <div class="message-bubble">${renderMarkdown(msg.content)}</div>
                        ${msg.references && msg.references.length ? `
                            <div class="message-references">
                                📚 参考: ${msg.references.map(r => r.doc_name).join(', ')}
                            </div>` : ''}
                        <div class="message-time">${formatDateTime(msg.created_at)}</div>
                    </div>
                </div>`).join('');
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content) return;

            if (!currentConvId) {
                try {
                    const result = await api.createConversation(currentCourseId || null, content.slice(0, 20));
                    currentConvId = result.data.id;
                    loadConversations(); // 不await，并行执行
                } catch (error) {
                    showToast('创建对话失败', 'error');
                    return;
                }
            }

            input.value = '';
            const sendBtn = document.getElementById('sendBtn');
            const stopBtn = document.getElementById('stopBtn');
            sendBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');

            const container = document.getElementById('chatMessages');
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();

            // 用 insertAdjacentHTML 追加，避免 innerHTML += 重解析整个容器
            const msgId = 'msg-' + Date.now();
            container.insertAdjacentHTML('beforeend', `
                <div class="message user">
                    <div class="message-avatar">我</div>
                    <div class="message-content">
                        <div class="message-bubble">${renderMarkdown(content)}</div>
                        <div class="message-time">刚刚</div>
                    </div>
                </div>
                <div class="message assistant" id="${msgId}">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-bubble"><span class="streaming-cursor"></span></div>
                        <div class="message-references hidden" id="${msgId}-refs"></div>
                        <div class="message-time">刚刚</div>
                    </div>
                </div>`);

            const bubble = document.querySelector(`#${msgId} .message-bubble`);
            const refsEl = document.getElementById(`${msgId}-refs`);
            container.scrollTop = container.scrollHeight;

            currentStreamController = api.streamMessage(
                currentConvId, content, tempFileSessionId,
                // onChunk — 仅记录文本，由 rAF 统一渲染
                (delta, fullText) => { scheduleStreamUpdate(bubble, fullText, container); },
                // onDone
                (fullText, citations, interrupted) => {
                    // 取消任何挂起的 rAF，直接做最终渲染
                    if (streamRafId) { cancelAnimationFrame(streamRafId); streamRafId = null; }
                    const finalText = fullText || pendingStreamText || '';
                    pendingStreamText = null;
                    lastStableHtml = '';
                    lastStableBoundary = -1;

                    bubble.innerHTML = renderMarkdown(finalText);

                    if (citations && citations.length) {
                        const courseRefs = citations.filter(c => c.source !== 'temp_file');
                        const tempRefs = citations.filter(c => c.source === 'temp_file');
                        let refHtml = '';
                        if (courseRefs.length) refHtml += '📚 课程资料: ' + courseRefs.map(r => `[${r.num}]`).join(' ') + ' ';
                        if (tempRefs.length) refHtml += '<span class="temp-file-badge">临时文件</span>';
                        refsEl.innerHTML = refHtml;
                        refsEl.classList.remove('hidden');
                    }
                    if (interrupted) showToast('生成已停止', 'warning');

                    sendBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    currentStreamController = null;
                    loadConversations(); // 后台刷新，不阻塞
                },
                // onError
                (error) => {
                    if (streamRafId) { cancelAnimationFrame(streamRafId); streamRafId = null; }
                    pendingStreamText = null;
                    lastStableHtml = '';
                    lastStableBoundary = -1;
                    bubble.innerHTML = '<em style="color:var(--gray-500)">AI 服务暂时不可用: ' + error.message + '</em>';
                    sendBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    currentStreamController = null;
                    showToast('发送失败: ' + error.message, 'error');
                }
            );
        }

        function stopStreaming() {
            if (currentStreamController) {
                currentStreamController.abort();
                if (currentConvId) {
                    api.interruptStream(currentConvId).catch(() => {});
                }
                currentStreamController = null;
            }
        }

        // 临时文件处理
        const MAX_TEMP_FILE_SIZE = 200 * 1024 * 1024; // 200MB

        // ========== 临时文件状态轮询 ==========
        async function pollTempFileStatus(fileId) {
            const maxPolls = 120;  // 最多轮询 120 次（10 分钟，每 5 秒一次）
            let pollCount = 0;

            while (pollCount < maxPolls) {
                await new Promise(resolve => setTimeout(resolve, 5000));  // 每 5 秒查询一次

                try {
                    const result = await api.getTempFileStatus(currentConvId, fileId);
                    const status = result.data.status;

                    if (status === 'done') {
                        // 更新状态为完成
                        const idx = tempFiles.findIndex(f => f.file_id === fileId);
                        if (idx >= 0) {
                            tempFiles[idx].status = 'done';
                            tempFiles[idx].preview = result.data.preview || '';
                        }
                        renderTempFileBar();
                        return;
                    } else if (status === 'error') {
                        const idx = tempFiles.findIndex(f => f.file_id === fileId);
                        if (idx >= 0) {
                            tempFiles[idx].status = 'error';
                        }
                        renderTempFileBar();
                        return;
                    }
                    // status === 'processing' → 继续轮询
                } catch (e) {
                    // 网络错误时继续重试
                }

                pollCount++;
            }

            // 超时：标记为完成（后端可能已完成但状态更新丢失）
            const idx = tempFiles.findIndex(f => f.file_id === fileId);
            if (idx >= 0 && tempFiles[idx].status === 'processing') {
                tempFiles[idx].status = 'done';
                renderTempFileBar();
            }
        }

        async function handleTempFileUpload(input) {
            if (!input.files || !input.files[0]) return;

            const file = input.files[0];
            if (file.size > MAX_TEMP_FILE_SIZE) {
                showToast(`文件过大 (${formatFileSize(file.size)})，最大支持 200MB`, 'error');
                input.value = '';
                return;
            }

            if (!currentConvId) {
                // 自动创建对话
                try {
                    const result = await api.createConversation(currentCourseId || null, '临时文件对话');
                    currentConvId = result.data.id;
                    await loadConversations();
                } catch (error) {
                    showToast('创建对话失败', 'error');
                    input.value = '';
                    return;
                }
            }

            // 提取扩展名，先显示"处理中"状态（用临时 ID 占位）
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const tempStatusId = 'uploading-' + Date.now();
            tempFiles.push({
                file_id: tempStatusId,
                filename: file.name,
                file_type: ext,
                file_size: file.size,
                status: 'processing'
            });
            renderTempFileBar();

            input.value = '';

            try {
                // 上传立即返回（后端异步处理），不再阻塞
                const result = await api.uploadTempFile(currentConvId, file);
                const fileData = result.data.file;
                tempFileSessionId = result.data.session_id;

                // 用服务器返回的真实 file_id 替换占位条目，开始轮询
                const idx = tempFiles.findIndex(f => f.file_id === tempStatusId);
                if (idx >= 0) {
                    tempFiles[idx].file_id = fileData.file_id;
                    tempFiles[idx].filename = fileData.filename;
                    tempFiles[idx].file_type = fileData.file_type;
                    tempFiles[idx].file_size = fileData.file_size;
                    // 状态保持 'processing'，等待轮询更新
                }
                renderTempFileBar();

                // 启动后台轮询（不 await，让用户继续操作）
                pollTempFileStatus(fileData.file_id);

                showToast(`文件已接收，正在后台处理: ${fileData.filename}`, 'success');
            } catch (error) {
                // 更新为失败状态
                const idx = tempFiles.findIndex(f => f.file_id === tempStatusId);
                if (idx >= 0) {
                    tempFiles[idx].status = 'error';
                }
                renderTempFileBar();
                showToast('文件上传失败: ' + error.message, 'error');
            }
        }

        function renderTempFileBar() {
            const bar = document.getElementById('tempFileBar');
            const list = document.getElementById('tempFileList');

            if (tempFiles.length === 0) {
                bar.classList.add('hidden');
                return;
            }

            bar.classList.remove('hidden');
            list.innerHTML = tempFiles.map(f => {
                let statusBadge = '';
                if (f.status === 'processing') {
                    statusBadge = '<span class="temp-file-status processing">⏳ 处理中...</span>';
                } else if (f.status === 'error') {
                    statusBadge = '<span class="temp-file-status error">❌ 失败</span>';
                }
                // 'done' 状态不显示额外标记（界面保持简洁）
                return `
                    <span class="temp-file-item">
                        ${getFileEmoji(f.file_type)} ${f.filename}
                        ${statusBadge}
                        <span class="temp-file-remove" onclick="removeTempFile('${f.file_id}')">&times;</span>
                    </span>
                `;
            }).join('');
        }

        function removeTempFile(fileId) {
            tempFiles = tempFiles.filter(f => f.file_id !== fileId);
            if (tempFiles.length === 0) {
                tempFileSessionId = null;
            }
            renderTempFileBar();
        }

        function clearTempFiles() {
            tempFiles = [];
            tempFileSessionId = null;
            renderTempFileBar();
            showToast('临时文件已清除', 'info');
        }

        // ========== 流式渲染优化 ==========
        // rAF 批处理：每帧最多更新一次 DOM，合并多个 token 的累积文本
        // 稳定内容缓存：按段落分割，已完成段落的 HTML 不重复计算
        let lastStableHtml = '';
        let lastStableBoundary = -1;

        function scheduleStreamUpdate(bubble, fullText, container) {
            pendingStreamText = fullText;
            if (!streamRafId) {
                streamRafId = requestAnimationFrame(() => {
                    streamRafId = null;
                    if (pendingStreamText !== null) {
                        performStreamUpdate(bubble, pendingStreamText, container);
                        pendingStreamText = null;
                    }
                });
            }
        }

        function performStreamUpdate(bubble, text, container) {
            // 在最后一个段落边界处分割（双换行）
            // 稳定部分（已完成段落）的 HTML 缓存复用，仅重渲染活动尾部
            const boundary = text.lastIndexOf('\n\n');
            let newHtml;
            if (boundary > 0 && boundary !== lastStableBoundary) {
                const stableRaw = text.slice(0, boundary);
                const tailRaw = text.slice(boundary);
                lastStableHtml = renderMarkdown(stableRaw);
                lastStableBoundary = boundary;
                newHtml = lastStableHtml + renderMarkdown(tailRaw);
            } else if (boundary > 0 && boundary === lastStableBoundary) {
                const tailRaw = text.slice(boundary);
                newHtml = lastStableHtml + renderMarkdown(tailRaw);
            } else {
                newHtml = renderMarkdown(text);
            }
            bubble.innerHTML = newHtml + '<span class="streaming-cursor"></span>';
            container.scrollTop = container.scrollHeight;
        }

        function handleInputKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ========== 页面可见性处理（防止切标签页导致流中断） ==========
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // 切回标签页时，如果流仍在活跃，滚动到最新内容
                if (currentStreamController) {
                    const container = document.getElementById('chatMessages');
                    container.scrollTop = container.scrollHeight;
                }
            }
        });

        // 页面卸载前确保中断流（防止连接泄露）
        window.addEventListener('beforeunload', () => {
            if (currentStreamController) {
                currentStreamController.abort();
                if (currentConvId) {
                    // 使用 sendBeacon 确保中断请求发送
                    navigator.sendBeacon(
                        `${API_BASE}/conversations/${currentConvId}/interrupt`,
                        new Blob([JSON.stringify({})], {type: 'application/json'})
                    );
                }
                currentStreamController = null;
            }
        });

        // 初始化
        loadCourses().then(() => loadConversations());
    </script>
</body>
</html>
